[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realtykit"
version = "0.1.0"
description = "Local-first US housing dashboard API (ingest + analysis)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
]

[project.scripts]
realtykit = "realtykit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["realtykit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
